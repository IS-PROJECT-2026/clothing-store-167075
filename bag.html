<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bag — KITU.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style .css">
</head>
<body>

  <header class="site-header">
    <div class="wrap header-inner">
      <a href="index.html" class="logo">KITU<span class="dot">.</span></a>

      <nav class="nav" id="siteNav">
        <a href="index.html">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>

      <div class="header-actions">
        <a href="bag.html" class="cart-btn" id="cartBtn" aria-label="Cart">
          Bag <span class="cart-count" id="cartCount">0</span>
        </a>
        <button class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap bag-page">
    <p class="eyebrow">Your bag</p>
    <div class="bag-header-row">
      <h1>Ready to check out.</h1>
      <button id="clearBag" class="clear-bag-btn" type="button">Clear bag</button>
    </div>

    <div class="bag-layout">
      <section class="bag-items" id="bagItems"></section>

      <aside class="bag-summary">
        <h2>Summary</h2>
        <div class="summary-row">
          <span>Subtotal</span>
          <strong id="bagSubtotal">KES 0</strong>
        </div>
        <div class="summary-row total-row">
          <span>Total</span>
          <strong id="bagTotal">KES 0</strong>
        </div>
        <button class="checkout-btn" type="button">Checkout</button>
      </aside>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <div>
        <p class="logo footer-logo">KITU<span class="dot">.</span></p>
        <p class="footer-tag">Everyday wear, deliberately made.</p>
      </div>
      <div class="footer-links">
        <div>
          <h4>Shop</h4>
          <a href="index.html">All products</a>
          <a href="about.html">About</a>
        </div>
        <div>
          <h4>Studio</h4>
          <p>Nairobi, Kenya</p>
          <p>hello@kitu.example</p>
        </div>
      </div>
    </div>
    <p class="footer-bottom">&copy; 2026 KITU. Built for a Git &amp; GitHub coursework project.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
